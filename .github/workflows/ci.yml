name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy Yingce Studio source
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: yingce-studio-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: yingce-studio-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whether production source changed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            before_sha="$(git rev-parse "$TARGET_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$before_sha" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$TARGET_SHA")"
          else
            changed_files="$(git diff --name-only "$before_sha" "$TARGET_SHA")"
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          if grep -Eiv '^(\.github/|docs/|README([^/]*)?$|AGENTS\.md$|CONTRIBUTING\.md$|.*\.md$)' <<<"$changed_files" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Connect to the private server network
        if: steps.scope.outputs.changed == 'true'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:tingjian-ci
          ping: 100.78.228.11
      - name: Deploy the verified commit over restricted SSH
        if: steps.scope.outputs.changed == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BEFORE_SHA: ${{ steps.scope.outputs.before_sha }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          private_key_file="$(mktemp "$HOME/.ssh/deploy-key.XXXXXX")"
          known_hosts_file="$(mktemp "$HOME/.ssh/known-hosts.XXXXXX")"
          trap 'rm -f "$private_key_file" "$known_hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$private_key_file"
          chmod 600 "$private_key_file"
          unset DEPLOY_SSH_KEY
          printf '%s\n' '217.142.236.67 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIN3QjQrhuDcmqAnqsFLgevYPee3JoRkh+R8qR20AI7jP' > "$known_hosts_file"
          if [[ "$BEFORE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            deploy_command="deploy $TARGET_SHA $BEFORE_SHA"
          else
            deploy_command="deploy $TARGET_SHA"
          fi
          ssh -i "$private_key_file" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts_file" -o HostKeyAlias=217.142.236.67 tingjian-deploy@100.78.228.11 "$deploy_command"
