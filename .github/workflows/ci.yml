name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy Yingce Studio source
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
    concurrency:
      group: yingce-studio-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Check whether production source changed
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          before_sha="$BEFORE_SHA"
          if [[ -z "$before_sha" || "$before_sha" =~ ^0+$ ]]; then
            before_sha="$(git rev-parse "$TARGET_SHA^" 2>/dev/null || true)"
          fi
          if [[ -z "$before_sha" ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$TARGET_SHA")"
          else
            changed_files="$(git diff --name-only "$before_sha" "$TARGET_SHA")"
          fi
          echo "before_sha=$before_sha" >> "$GITHUB_OUTPUT"
          if grep -Eiv '^(\.github/|docs/|README([^/]*)?$|AGENTS\.md$|CONTRIBUTING\.md$|.*\.md$)' <<<"$changed_files" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Queue signed source deployment and wait for server health
        if: steps.scope.outputs.changed == 'true'
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          BEFORE_SHA: ${{ steps.scope.outputs.before_sha }}
          TARGET_SHA: ${{ github.sha }}
          DELIVERY_ID: ${{ github.run_id }}
        run: |
          node --input-type=module <<'NODE'
          import { createHmac } from 'node:crypto'
          const secret = process.env.DEPLOY_SECRET
          if (!secret || secret.length < 32) throw new Error('deployment secret is not configured')
          const payload = {
            repository: { full_name: process.env.REPOSITORY },
            ref: process.env.REF,
            before: process.env.BEFORE_SHA,
            after: process.env.TARGET_SHA,
          }
          const body = JSON.stringify(payload)
          const signature = 'sha256=' + createHmac('sha256', secret).update(body).digest('hex')
          const accepted = await fetch('https://ad.gaoseafood.com/api/deploy-hook/yingce-studio', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-github-event': 'push',
              'x-github-delivery': process.env.DELIVERY_ID,
              'x-hub-signature-256': signature,
            },
            body,
          })
          const receipt = await accepted.json()
          if (!accepted.ok || receipt.queued !== true) throw new Error('server did not queue the source deployment')
          const statusUrl = new URL('https://ad.gaoseafood.com/api/deploy-hook/yingce-studio/status')
          statusUrl.searchParams.set('sha', process.env.TARGET_SHA)
          for (let attempt = 0; attempt < 540; attempt++) {
            const response = await fetch(statusUrl, { headers: { 'x-deploy-token': secret } })
            const state = await response.json()
            if (!response.ok) throw new Error('server deployment status could not be read')
            if (state.status === 'succeeded') {
              console.log('Production source deployment succeeded for ' + state.sha)
              process.exit(0)
            }
            if (state.status === 'failed') throw new Error('Production source deployment failed: ' + (state.message || 'see server deployment logs'))
            await new Promise(resolve => setTimeout(resolve, 10000))
          }
          throw new Error('Timed out waiting for the server source deployment')
          NODE
